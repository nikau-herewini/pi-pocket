# This file lives on main. The upstream branch excludes all of .github.
name: Sync upstream mirror

on:
    schedule:
        - cron: "23 3 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: sync-upstream-mirror
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'nikau-herewini/pi-pocket' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: upstream
                  fetch-depth: 1
                  fetch-tags: false
                  persist-credentials: false
            - name: Sync upstream source without .github, tags, or force
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  previous="$(git log -1 --format='%(trailers:key=Upstream-Source,valueonly)')"
                  if [[ ! "$previous" =~ ^[0-9a-f]{40}$ || -n "$(git ls-tree HEAD -- .github)" ]]; then
                      echo '::error::The upstream branch is missing its filtered sync baseline.'
                      exit 1
                  fi
                  git fetch --no-tags https://github.com/TannerMidd/pi-pocket.git refs/heads/main
                  target="$(git rev-parse FETCH_HEAD)"
                  if ! git merge-base --is-ancestor "$previous" "$target"; then
                      echo "::error::Upstream source $target does not descend from $previous."
                      exit 1
                  fi

                  # Read the source tree without checking it out. Never push its commits.
                  index_dir="$(mktemp -d)"
                  trap 'rm -r -- "$index_dir"' EXIT
                  export GIT_INDEX_FILE="$index_dir/index"
                  git read-tree "$target"
                  git rm -rf --cached --ignore-unmatch -- .github
                  tree="$(git write-tree)"
                  if [[ "$tree" == "$(git rev-parse HEAD^{tree})" ]]; then
                      echo "No source changes outside .github through $target." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  commit="$(git commit-tree "$tree" -p HEAD \
                      -m 'Sync upstream source without .github' -m "Upstream-Source: $target")"
                  git -c credential.helper= \
                      -c 'credential.helper=!gh auth git-credential' \
                      push origin "$commit:refs/heads/upstream"
                  echo "Synced source $target to upstream as $commit." >> "$GITHUB_STEP_SUMMARY"
