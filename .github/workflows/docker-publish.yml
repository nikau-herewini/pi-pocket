name: Publish Docker image

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docker-publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'nikau-herewini/pi-pocket' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long,prefix=sha-

            # ARM64 publication is paused. Compile the client natively instead
            # of spending the publication timeout in an emulated Rust build.
            - name: Build and publish the AMD64 image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=docker-publish-amd64
                  cache-to: type=gha,mode=max,scope=docker-publish-amd64
